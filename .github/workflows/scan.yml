# Runs the Kalshi scanner in the cloud every 10 minutes and publishes the dashboard to GitHub Pages.
# Paper trading state (the sqlite file) is carried between runs with the Actions cache.
name: Kalshi scan

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may start scheduled runs a few minutes late
  workflow_dispatch: {}       # "Run workflow" button for a manual scan

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: kalshi-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore paper-trading state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: kalshi-state-${{ github.run_id }}
          restore-keys: kalshi-state-

      - name: Scan every Kalshi market + paper trade
        env:
          STATE_DIR: state
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          mkdir -p state site
          python scanner_bot.py --cron site

      - name: Save paper-trading state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: kalshi-state-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
